name: update-news
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum interval; runs can be delayed under load
  workflow_dispatch: {}      # run it by hand from the Actions tab
permissions:
  contents: write
concurrency:
  group: update-news
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: { path: code }
      - uses: actions/checkout@v4
        with: { ref: data, path: data }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch, score, write stories.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OUT: ${{ github.workspace }}/data/stories.json
        run: python code/pipeline/run.py
      - name: Save to the data branch
        working-directory: data
        run: |
          git config user.name "newsweight-bot"
          git config user.email "bot@users.noreply.github.com"
          git add stories.json
          git diff --cached --quiet || (git commit -m "update stories" && git pull --rebase origin data && git push origin data)
